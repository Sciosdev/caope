name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint changed PHP files
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pcntl, sqlite3, zip
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          composer-options: '--no-progress --no-interaction --prefer-dist'

      - name: Run project Pint on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}"; then
            BASE_SHA=$(git rev-parse HEAD^)
          fi

          mapfile -d '' candidates < <(
            git diff --relative --name-only -z --diff-filter=ACMRT "$BASE_SHA" "$GITHUB_SHA" -- \
              'app/*.php' \
              'app/**/*.php' \
              'bootstrap/*.php' \
              'bootstrap/**/*.php' \
              'config/*.php' \
              'config/**/*.php' \
              'database/*.php' \
              'database/**/*.php' \
              'routes/*.php' \
              'routes/**/*.php' \
              'tests/*.php' \
              'tests/**/*.php'
          )

          files=()
          for file in "${candidates[@]}"; do
            if [ -f "$file" ]; then
              files+=("$file")
            fi
          done

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed PHP files require Pint."
            exit 0
          fi

          printf 'Checking %s\n' "${files[@]}"
          vendor/bin/pint --test "${files[@]}"

  test:
    name: Test Laravel application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked runtime secrets and populated databases
        working-directory: ${{ github.workspace }}
        shell: bash
        run: bash scripts/check-repository-hygiene.sh

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, pcntl, sqlite3, zip
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          composer-options: '--no-progress --no-interaction --prefer-dist'

      - name: Prepare application
        run: |
          cp .env.testing .env
          mkdir -p database
          : > database/database.sqlite
          test ! -s database/database.sqlite

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run stable deployment gate
        run: |
          php artisan test --testsuite=Unit
          php artisan test \
            tests/Feature/Developer \
            tests/Feature/Admin/UserManagementTest.php \
            tests/Feature/Smoke/SecuritySmokeTest.php \
            tests/Feature/Auth/AuthenticationTest.php \
            tests/Feature/Auth/PasswordConfirmationTest.php
          composer test:security-baseline
          composer test:access-control

      - name: Run complete legacy suite (diagnostic)
        continue-on-error: true
        run: php artisan test

      - name: Compile Blade templates
        run: php artisan view:cache

      - name: Run Blade linter
        run: php artisan blade:validate

      - name: Build frontend assets with Vite
        run: npm run build

      - name: Verify compiled assets are committed
        run: git diff --exit-code -- public/assets/build
