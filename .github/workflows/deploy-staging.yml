name: Deploy staging
run-name: Deploy staging ${{ inputs.ref || 'main' }} [${{ inputs.request_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama aprobada para pruebas'
        required: true
        default: main
        type: choice
        options:
          - main
      request_id:
        description: 'Identificador de auditoría generado por CAOPE'
        required: false
        default: manual

permissions:
  contents: read

concurrency:
  group: caope-staging
  cancel-in-progress: false

jobs:
  validate:
    name: Validate staging release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout approved ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pcntl, sqlite3
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          composer-options: '--no-progress --no-interaction --prefer-dist'

      - name: Prepare test environment
        run: |
          cp .env.testing .env
          touch database/database.sqlite

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Run deployment test gate
        run: |
          php artisan test --testsuite=Unit
          php artisan test \
            tests/Feature/Developer \
            tests/Feature/Admin/UserManagementTest.php \
            tests/Feature/Smoke/SecuritySmokeTest.php \
            tests/Feature/Auth/AuthenticationTest.php \
            tests/Feature/Auth/PasswordConfirmationTest.php

      - name: Simulate the cPanel bootstrap
        run: bash ../scripts/tests/bootstrap-cpanel-smoke.sh

      - name: Validate and compile Blade templates
        run: |
          php artisan blade:validate
          php artisan view:cache

      - name: Build frontend assets
        run: npm run build

      - name: Verify compiled assets are committed
        run: git diff --exit-code -- public/assets/build

      - name: Record validated revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to cPanel staging
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: staging
      url: https://caope.ayudafesi.com
    env:
      CPANEL_HEALTH_URL: ${{ secrets.CPANEL_HEALTH_URL }}
      STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
      DEPLOY_REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
    steps:
      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail

          for variable in CPANEL_HEALTH_URL STAGING_DEPLOY_TOKEN; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Missing required staging secret: ${variable}"
              exit 1
            fi
          done

      - name: Authorize the exact staging revision
        id: deployment_request
        shell: bash
        run: |
          set -euo pipefail

          echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

          payload="$(jq -nc \
            --arg sha "${EXPECTED_SHA}" \
            --arg request_id "${DEPLOY_REQUEST_ID}" \
            '{sha: $sha, request_id: $request_id}')"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            --request POST \
            --header "Authorization: Bearer ${STAGING_DEPLOY_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${CPANEL_HEALTH_URL%/}/api/deployment/prepare" \
            > /dev/null

      - name: Wait for scheduled deployment
        shell: bash
        env:
          STARTED_AT: ${{ steps.deployment_request.outputs.started_at }}
        run: |
          set -euo pipefail

          version_url="${CPANEL_HEALTH_URL%/}/api/deployment/version"

          for attempt in $(seq 1 120); do
            response="$(curl --fail --silent --show-error --max-time 15 "${version_url}" || true)"
            deployed_sha="$(jq -r '.sha // empty' <<< "${response}" 2>/dev/null || true)"
            deployed_at="$(jq -r '.deployed_at // empty' <<< "${response}" 2>/dev/null || true)"
            deployed_epoch="$(date -u -d "${deployed_at}" +%s 2>/dev/null || echo 0)"

            if [[ "${deployed_sha}" == "${EXPECTED_SHA}" ]] \
              && (( deployed_epoch >= STARTED_AT - 60 )); then
              curl \
                --fail \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 3 \
                "${CPANEL_HEALTH_URL%/}/up" \
                > /dev/null
              echo "Staging now serves ${EXPECTED_SHA}."
              exit 0
            fi

            echo "Waiting for the cPanel scheduler (${attempt}/120)..."
            sleep 10
          done

          echo "Staging did not publish ${EXPECTED_SHA} within 20 minutes."
          exit 1
