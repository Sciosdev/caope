name: Deploy
run-name: Deploy production ${{ inputs.ref || 'main' }} [${{ inputs.request_id || 'manual' }}]

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Rama aprobada para producción'
        required: true
        default: main
        type: choice
        options:
          - main
      request_id:
        description: 'Identificador de auditoría generado por CAOPE'
        required: false
        default: manual

permissions:
  contents: read

concurrency:
  group: caope-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout approved ref
        uses: actions/checkout@v4
        with:
          # Pin the exact revision attached to this workflow run. This keeps
          # GitHub's attested head SHA identical to the code tested below.
          ref: ${{ github.sha }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, intl, pcntl, sqlite3
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          working-directory: backend
          composer-options: '--no-progress --no-interaction --prefer-dist'

      - name: Prepare test environment
        run: |
          cp .env.testing .env
          touch database/database.sqlite

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      # The repository currently has legacy feature failures outside the deploy
      # path. Keep this gate strict and deterministic until that baseline is
      # repaired, instead of making every production request impossible.
      - name: Run deployment test gate
        run: |
          php artisan test --testsuite=Unit
          php artisan test \
            tests/Feature/Developer \
            tests/Feature/Admin/UserManagementTest.php \
            tests/Feature/Smoke/SecuritySmokeTest.php \
            tests/Feature/Auth/AuthenticationTest.php \
            tests/Feature/Auth/PasswordConfirmationTest.php

      - name: Simulate the cPanel bootstrap
        run: bash ../scripts/tests/bootstrap-cpanel-smoke.sh

      - name: Validate Blade templates
        run: php artisan blade:validate

      - name: Compile Blade templates
        run: php artisan view:cache

      - name: Build frontend assets
        run: npm run build

      - name: Verify compiled assets are committed
        run: git diff --exit-code -- public/assets/build

      - name: Record validated revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: validate
    environment:
      name: production
      url: https://xocoyotzin.iztacala.unam.mx/caope
    env:
      PRODUCTION_URL: https://xocoyotzin.iztacala.unam.mx/caope
      DEPLOY_REQUEST_ID: ${{ inputs.request_id }}
      EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
      DEPLOY_RUN_ID: ${{ github.run_id }}
      DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Authorize the exact production revision
        id: deployment_request
        shell: bash
        run: |
          set -euo pipefail

          echo "started_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"

          payload="$(jq -nc \
            --arg sha "${EXPECTED_SHA}" \
            --arg request_id "${DEPLOY_REQUEST_ID}" \
            --argjson run_id "${DEPLOY_RUN_ID}" \
            --argjson run_attempt "${DEPLOY_RUN_ATTEMPT}" \
            '{sha: $sha, request_id: $request_id, run_id: $run_id, run_attempt: $run_attempt}')"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 30 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "${payload}" \
            "${PRODUCTION_URL%/}/api/deployment/prepare" \
            > /dev/null

      - name: Wait for scheduled production deployment
        shell: bash
        env:
          STARTED_AT: ${{ steps.deployment_request.outputs.started_at }}
        run: |
          set -euo pipefail

          version_url="${PRODUCTION_URL%/}/api/deployment/version"

          for attempt in $(seq 1 210); do
            response="$(curl --fail --silent --show-error --max-time 15 "${version_url}" || true)"
            deployed_sha="$(jq -r '.sha // empty' <<< "${response}" 2>/dev/null || true)"
            deployed_request_id="$(jq -r '.request_id // empty' <<< "${response}" 2>/dev/null || true)"
            deployed_at="$(jq -r '.deployed_at // empty' <<< "${response}" 2>/dev/null || true)"
            deployed_epoch="$(date -u -d "${deployed_at}" +%s 2>/dev/null || echo 0)"

            if [[ "${deployed_sha}" == "${EXPECTED_SHA}" ]] \
              && [[ "${deployed_request_id}" == "${DEPLOY_REQUEST_ID}" ]] \
              && (( deployed_epoch >= STARTED_AT - 60 )); then
              curl \
                --fail \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 3 \
                "${PRODUCTION_URL%/}/up" \
                > /dev/null
              echo "Production now serves ${EXPECTED_SHA}."
              exit 0
            fi

            echo "Waiting for the production scheduler (${attempt}/210)..."
            sleep 10
          done

          echo "Production did not publish ${EXPECTED_SHA} within 35 minutes."
          exit 1
